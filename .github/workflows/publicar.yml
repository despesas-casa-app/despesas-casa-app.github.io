# Publica o app no GitHub Pages a cada push no branch "main".
# Só publica se o verificador de segredos, o lint, os tipos e os testes passarem.
#
# Segurança:
# - cada ação de terceiros está travada pelo código exato do commit (não por "v5", que pode mudar);
# - permissões mínimas: o passo de build só lê o repositório;
# - só o passo final tem permissão para publicar no Pages.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar-e-construir:
    name: Verificar e construir
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Instalar dependências (exatamente as do lockfile)
        run: npm ci

      - name: Verificar segredos e dados pessoais
        run: npm run verificar-segredos

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run tipos

      - name: Testes com cobertura
        run: npm run test:cobertura

      - name: Calcular o endereço-base do site
        env:
          REPO: ${{ github.event.repository.name }}
          DONO: ${{ github.repository_owner }}
        run: |
          if [ "${REPO,,}" = "${DONO,,}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${REPO}/" >> "$GITHUB_ENV"
          fi

      - name: Construir o site
        run: npm run build

      - name: Empacotar para o Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    name: Publicar
    needs: verificar-e-construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
