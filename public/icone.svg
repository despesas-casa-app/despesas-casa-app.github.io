<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Viver Gasta: azulejos amarelos esmaltados. Mesmo desenho de scripts/gerar-icones.mjs. -->
  <defs>
    <linearGradient id="esmalte" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe3ae"/>
      <stop offset="1" stop-color="#f4c76b"/>
    </linearGradient>
    <linearGradient id="reflexo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.36" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.485" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <g id="azulejo">
      <rect width="144" height="144" rx="20" fill="url(#esmalte)"/>
      <rect width="144" height="144" rx="20" fill="url(#reflexo)"/>
      <rect x="1.5" y="1.5" width="141" height="141" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="104" fill="#fffcf4"/>
  <use href="#azulejo" x="26" y="26"/>
  <use href="#azulejo" x="184" y="26"/>
  <use href="#azulejo" x="342" y="26"/>
  <use href="#azulejo" x="26" y="184"/>
  <use href="#azulejo" x="184" y="184"/>
  <use href="#azulejo" x="342" y="184"/>
  <use href="#azulejo" x="26" y="342"/>
  <use href="#azulejo" x="184" y="342"/>
  <use href="#azulejo" x="342" y="342"/>
</svg>
